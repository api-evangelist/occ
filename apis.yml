apis:
  - aid: occ:financial-institution-search
    name: OCC Financial Institution Search API
    description: Search for Community Reinvestment Act (CRA), enforcement, and institution data for OCC-regulated national banks, federal savings associations, and federal branches and agencies of foreign banking organizations by financial institution name or charter number.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://apps.occ.gov
    humanURL: https://www.occ.treas.gov/publications-and-resources/tools/occ-financial-institution-search/index-occ-financial-institution-search.html
    properties:
      - type: Documentation
        url: https://www.occ.treas.gov/publications-and-resources/tools/occ-financial-institution-search/index-occ-financial-institution-search.html
    tags:
      - Financial Institutions
      - National Banks
      - Federal Savings Associations
      - CRA
      - Search
  - aid: occ:cra-performance-evaluations
    name: OCC CRA Performance Evaluations Search API
    description: Search and retrieve Community Reinvestment Act (CRA) performance evaluations for national banks and federal savings associations. Records available from April 1996 onward, searchable by charter number, bank name, city, rating, state, and evaluation or public release date.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://apps.occ.gov
    humanURL: https://www.occ.treas.gov/publications-and-resources/tools/index-cra-search.html
    properties:
      - type: Documentation
        url: https://www.occ.treas.gov/publications-and-resources/tools/index-cra-search.html
    tags:
      - CRA
      - Community Reinvestment Act
      - Performance Evaluations
      - National Banks
      - Federal Savings Associations
  - aid: occ:enforcement-actions
    name: OCC Enforcement Actions Search API
    description: Search and retrieve enforcement actions taken by the OCC against national banks, federal savings associations, and individuals. Searchable by bank name, person name, city, state, date range, enforcement action type, and subject matter.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://apps.occ.gov
    humanURL: https://apps.occ.gov/EASearch
    properties:
      - type: Documentation
        url: https://www.occ.treas.gov/topics/laws-and-regulations/enforcement-actions/index-enforcement-actions.html
    tags:
      - Enforcement Actions
      - Regulatory Compliance
      - National Banks
      - Federal Savings Associations
